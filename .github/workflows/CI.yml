name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:

  build-and-test:
      name: Build and test (Linux)
      runs-on: ubuntu-latest
      env:
        CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        # Ninja for the CMake presets; X11/OpenGL/udev headers for the client (SFML)
        - name: Install Ninja and client system libraries
          run: |
            sudo apt-get update
            sudo apt-get install -y ninja-build \
              libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl-dev

        # GoogleTest and Asio are downloaded by CPM; reuse them between runs
        - name: Cache dependencies
          uses: actions/cache@v4
          with:
            path: .cache/CPM
            key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

        # "ci" preset: Debug, warnings as errors. A failing test fails the job.
        - name: Configure, build and run tests
          run: scripts/test.sh ci

  mirror-to-epitech:
      runs-on: ubuntu-latest
      needs: build-and-test # Never mirror a main that does not build or pass its tests
      if: |
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        github.repository == 'Thibani/R-Type'
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Configure SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.EPITECH_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts

        - name: Push mirror to Epitech
          run: |
            git remote add epitech git@github.com:EpitechPGE3-2026/G-ING-500-STG-5-1-rtype-1.git
            git push --mirror epitech